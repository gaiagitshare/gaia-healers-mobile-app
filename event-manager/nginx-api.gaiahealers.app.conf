# api.gaiahealers.app — branded API for the Gaia Healers app
# Proxies all traffic to the gaia-staging-proxy (127.0.0.1:8787).
#
# NOTE: HTTP-only until DNS resolves and certbot issues a cert.
#       Run: sudo certbot --nginx -d api.gaiahealers.app
#       certbot will rewrite this file to add the 443 block + redirects.

# Rate-limit zone for the assist API (quota-burn protection).
limit_req_zone $binary_remote_addr zone=gaia_assist:10m rate=30r/m;

server {
    server_name api.gaiahealers.app;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

    # Keep ACME challenges working even after HTTPS redirect is added.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Voice/assist routes — protect with a per-IP rate limit.
    location ~ ^/api/assist/ {
        limit_req zone=gaia_assist burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # —— Event Manager (moved from ba2ki.com/event; React SPA + API on :8002) ——
    location /event {
        alias /var/www/event;
        try_files $uri $uri/ =404;
    }
    location /event/ {
        alias /var/www/event/;
        try_files $uri $uri/ /event/index.html;

        # The SPA shell must never be cached, or a deploy never reaches an admin
        # whose browser holds a stale index.html pointing at an old JS bundle.
        # Hashed assets under /event/static/ keep their immutable caching below.
        add_header Cache-Control "no-store, must-revalidate" always;

        # camera=(self) so the Check-In QR scanner (getUserMedia) can run. The
        # server-level policy disables the camera entirely; re-grant it here only
        # for the operator admin. These re-declare the server headers because an
        # add_header in a location replaces (not merges) the inherited set.
        add_header Permissions-Policy "camera=(self), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /event/static/ {
        alias /var/www/event/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Server-to-server only. The Gaia proxy reaches these on 127.0.0.1:8002,
    # so nothing legitimate arrives here over the public internet. The service
    # token already fails closed; this removes the surface entirely.
    location /event-api/identity/ {
        deny all;
        return 404;
    }

    # Public digital badge cards: the short URL printed on every badge QR.
    # Case-insensitive because the printed payload is UPPERCASE (smaller QR).
    # A vendor's own setup page. Server-rendered by the Event Manager: it is
    # opened once, on a phone, by somebody with no account.
    location ~* ^/vendor/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/c/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /event-api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # —— Standalone Admin (operator-only; NOT part of the public app) ——
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /var/www/gaia-admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Everything else.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.gaiahealers.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.gaiahealers.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.gaiahealers.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.gaiahealers.app;
    return 404; # managed by Certbot


}
