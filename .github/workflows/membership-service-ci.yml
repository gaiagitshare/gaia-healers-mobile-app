name: Membership service CI

on:
  push:
    branches: [main]
    paths:
      - "membership-service/**"
      - ".github/workflows/membership-service-ci.yml"
  pull_request:
    paths:
      - "membership-service/**"
      - ".github/workflows/membership-service-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: membership_test
          POSTGRES_PASSWORD: membership_test
          POSTGRES_DB: membership_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U membership_test" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      MEMBERSHIP_TEST_DATABASE_URL: postgres://membership_test:membership_test@127.0.0.1:5432/membership_test
    defaults:
      run:
        working-directory: membership-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: membership-service/package-lock.json
      - run: npm ci
      - run: npm test
