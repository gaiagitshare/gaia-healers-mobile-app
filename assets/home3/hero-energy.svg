<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice">
  <!-- Gaia Healers, original artwork (12 Nov 2026): a meditating figure in a
       luminous biofield, energy waves and particles. Drawn for this app. -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="70%">
      <stop offset="0" stop-color="#2f6b2a"/>
      <stop offset=".35" stop-color="#173d1f"/>
      <stop offset=".75" stop-color="#0d2416"/>
      <stop offset="1" stop-color="#0b1d12"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7ff9e" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#b7ff62" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#6fd34a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6fd34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ff9a"/>
      <stop offset=".55" stop-color="#7fd84c"/>
      <stop offset="1" stop-color="#2f8a2c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#b7ff62" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c9ff7a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b7ff62" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1d12" stop-opacity="1"/>
      <stop offset=".42" stop-color="#0b1d12" stop-opacity=".0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="900" height="360" fill="url(#bg)"/>
  <!-- aura rings -->
  <g transform="translate(640 190)">
    <circle r="210" fill="url(#halo)" opacity=".55" filter="url(#big)"/>
    <circle r="150" fill="none" stroke="#b7ff62" stroke-opacity=".22" stroke-width="1.5"/>
    <circle r="118" fill="none" stroke="#d6ff8f" stroke-opacity=".30" stroke-width="2" filter="url(#soft)"/>
    <circle r="92" fill="none" stroke="#e9ffb8" stroke-opacity=".45" stroke-width="2.5" filter="url(#soft)"/>
    <ellipse rx="190" ry="70" fill="none" stroke="#b7ff62" stroke-opacity=".18" stroke-width="1.2" transform="rotate(-18)"/>
    <ellipse rx="210" ry="88" fill="none" stroke="#b7ff62" stroke-opacity=".12" stroke-width="1" transform="rotate(14)"/>
  </g>
  <!-- flowing energy waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M220 250 C340 190 430 300 560 230 S760 120 900 170" stroke="url(#wave)" stroke-width="3" filter="url(#glow)" opacity=".8"/>
    <path d="M220 250 C340 190 430 300 560 230 S760 120 900 170" stroke="url(#wave)" stroke-width="1.4"/>
    <path d="M260 300 C380 240 470 330 600 270 S790 180 900 230" stroke="url(#wave)" stroke-width="1.1" opacity=".7"/>
    <path d="M300 120 C420 170 500 80 620 130 S800 230 900 110" stroke="url(#wave)" stroke-width="1.2" opacity=".55"/>
    <path d="M330 80 C450 120 540 50 650 90 S820 150 900 70" stroke="url(#wave)" stroke-width=".9" opacity=".4"/>
    <path d="M240 330 C360 300 480 350 610 315 S800 280 900 300" stroke="url(#wave)" stroke-width=".8" opacity=".45"/>
  </g>
  <!-- meditating figure -->
  <g transform="translate(640 196)">
    <ellipse cx="0" cy="26" rx="70" ry="90" fill="#b7ff62" opacity=".35" filter="url(#big)"/>
    <g fill="url(#body)" opacity=".86">
      <circle cx="0" cy="-62" r="17"/>
      <path d="M-12 -44 C-26 -40 -34 -26 -36 -6 C-38 14 -40 30 -52 44 C-62 56 -70 62 -84 70 C-92 75 -88 86 -76 86 L76 86 C88 86 92 75 84 70 C70 62 62 56 52 44 C40 30 38 14 36 -6 C34 -26 26 -40 12 -44 C6 -46 -6 -46 -12 -44 Z"/>
      <path d="M-36 -2 C-50 14 -58 30 -50 44 C-44 52 -30 50 -14 48 L-6 54 C-26 60 -48 62 -58 54 C-72 42 -62 14 -42 -6 Z" opacity=".9"/>
      <path d="M36 -2 C50 14 58 30 50 44 C44 52 30 50 14 48 L6 54 C26 60 48 62 58 54 C72 42 62 14 42 -6 Z" opacity=".9"/>
    </g>
    <!-- chakra points -->
    <g filter="url(#soft)">
      <circle cx="0" cy="-62" r="4" fill="#fff"/>
      <circle cx="0" cy="-30" r="3.5" fill="#f2ffcf"/>
      <circle cx="0" cy="-8" r="5" fill="#ffffff"/>
      <circle cx="0" cy="16" r="3.5" fill="#f2ffcf"/>
      <circle cx="0" cy="40" r="3" fill="#e9ffb8"/>
    </g>
    <circle cx="0" cy="-8" r="16" fill="#fff" opacity=".55" filter="url(#glow)"/>
  </g>
  <!-- particles -->
  <g fill="#e9ffb8">
    <circle cx="512" cy="96" r="1.6" opacity=".9"/><circle cx="548" cy="62" r="1.1" opacity=".7"/><circle cx="590" cy="110" r="1.3" opacity=".8"/>
    <circle cx="700" cy="70" r="1.5" opacity=".85"/><circle cx="742" cy="118" r="1" opacity=".6"/><circle cx="790" cy="84" r="1.8" opacity=".9"/>
    <circle cx="820" cy="150" r="1.2" opacity=".6"/><circle cx="760" cy="290" r="1.4" opacity=".7"/><circle cx="690" cy="320" r="1" opacity=".5"/>
    <circle cx="560" cy="300" r="1.3" opacity=".6"/><circle cx="470" cy="160" r="1" opacity=".5"/><circle cx="845" cy="250" r="1.6" opacity=".8"/>
    <circle cx="615" cy="40" r="1.2" opacity=".7"/><circle cx="660" cy="345" r="1.1" opacity=".55"/><circle cx="430" cy="220" r=".9" opacity=".45"/>
  </g>
  <g fill="#e9ffb8" filter="url(#soft)">
    <circle cx="790" cy="84" r="3" opacity=".6"/><circle cx="512" cy="96" r="3" opacity=".5"/><circle cx="845" cy="250" r="3" opacity=".5"/>
  </g>
  <rect width="900" height="360" fill="url(#fadeL)"/>
</svg>
