<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaia onboarding review</title><style>body{margin:0;padding:32px;background:#020805;color:#f5f7f5;font:16px system-ui}h1{font-weight:500}p{color:#a8b3ad;line-height:1.6}button{font:inherit;border:1px solid #345542;background:#102018;color:#f5f7f5;border-radius:12px;padding:12px 20px;cursor:pointer;margin:0 8px 12px 0}button[aria-pressed=true]{background:#75f05a;color:#07150b}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start}figure{margin:0;background:#0b1710;border:1px solid #243a2c;border-radius:16px;padding:16px}img{width:100%;height:auto;display:block}figcaption{margin:0 0 14px;color:#a8b3ad}a{color:#75f05a}</style><h1>Your Gaia journey — visual review</h1><p>Synthetic contact only. The existing app, with mocked GHL calls. Complete/reload/resume and embedded saves passed at all four widths.<br>Release awaits visual approval and a maintainer’s live GHL check.</p><nav aria-label="Screenshot width"></nav><main></main><script>const widths=[360,390,430,1280],states=['intro','primary-0','primary-1','primary-3','living-beings','environment','water','save-error','resume','completion','completion-bottom','assist'];function show(w){document.querySelector('main').innerHTML=states.map(s=>`<figure><figcaption>${w}px · ${s.replaceAll('-',' ')}</figcaption><a href="${w}-${s}.png"><img src="${w}-${s}.png" alt="${s} at ${w} pixels" loading="lazy"></a></figure>`).join('');document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===w+'px'));}document.querySelector('nav').innerHTML=widths.map(w=>`<button onclick="show(${w})" aria-pressed="false">${w}px</button>`).join('');show(390);</script></html>
