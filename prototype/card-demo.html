<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badge card — in-app demo (real modules, mocked API)</title>
<link rel="stylesheet" href="../gaia-system.css">
<style>
  body{background:#04070A;color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;margin:0;padding:18px;max-width:430px}
  .demo-note{font-size:12px;color:rgba(255,255,255,.5);margin:0 0 12px}
</style>
</head>
<body>
<p class="demo-note">Demo harness: the real <code>gaia-myevents.js</code> + <code>gaia-card.js</code> running against fixture data.</p>
<div data-myevents-host></div>
<script>
// ── Fixture API: what the proxy returns for a signed-in attendee ──────────
(function () {
  const now = new Date();
  const ev = {
    id: 1, name: 'Gaia Healers Elevate Conference 2026', startDate: '2026-11-20T14:00:00Z', endDate: '2026-11-22T23:00:00Z',
    location: 'Rosen Shingle Creek, Orlando, FL', timezone: 'America/New_York', heroImageUrl: '', isPublished: true, phase: 'upcoming',
    ticket: { name: 'Amara Okonkwo-Reyes', passLabel: 'General Admission + Conference', passCode: 'GA-CONF', isVip: false, grantsWorkshops: false,
      registrationStatus: 'registered', checkedIn: false, checkedInAt: null, effectiveLabel: 'General Admission + Conference',
      baseTicket: { code: 'GA-CONF', name: 'General Admission + Conference' }, addons: [], valid: true },
  };
  const card = {
    ok: true, authenticated: true, token: '7K2MXPQ4', card_url: 'https://card.gaiahealers.app/7K2MXPQ4',
    printed_payload: 'HTTPS://CARD.GAIAHEALERS.APP/7K2MXPQ4', public: false, claimed_at: null, views: 0,
    name: 'Amara Okonkwo-Reyes', event_name: ev.name, bio: '',
    fields: { display_name: '', headline: '', company: '', title: '', city: '', website: '', booking_url: '', instagram: '', linkedin: '', facebook: '', tiktok: '', youtube: '', whatsapp: '', photo_url: '', show_email: false, show_phone: false, tags: [], services: [], theme: 'gaia' },
    email_on_file: 'amara@example.com', phone_on_file: '+14075550142', networking_enabled: true,
    themes: ['gaia', 'sunrise', 'ocean', 'rose', 'forest', 'gold'],
  };
  window.__demoCard = card;
  const qrPng = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
  const routes = {
    '/api/events/mine': () => ({ ok: true, authenticated: true, events: [ev], unresolved: [] }),
    '/api/events/1/ticket': () => ({ ok: true, authenticated: true, event: ev, ticket: { ...ev.ticket, email: 'amara@example.com', qrCode: 'ATT-2E8F766C178B', qrImage: window.__demoQr || qrPng } }),
    '/api/events/1/upgrades': () => ({ ok: true, authenticated: true, upgrades: [] }),
    '/api/events/1/card': (body) => {
      if (body) {
        Object.assign(card.fields, Object.fromEntries(Object.entries(body).filter(([k]) => k in card.fields)));
        if ('bio' in body) card.bio = body.bio;
        if ('public' in body) { card.public = body.public; if (card.public && !card.claimed_at) card.claimed_at = now.toISOString(); }
        card.views = card.public ? 14 : 0;
      }
      return JSON.parse(JSON.stringify(card));
    },
  };
  const realFetch = window.fetch;
  window.fetch = async (url, options) => {
    const u = String(url);
    const path = u.replace(/^https?:\/\/[^/]+/, '');
    const key = Object.keys(routes).find((k) => path === k || path.startsWith(k + '?'));
    if (!key) return realFetch(url, options);
    let body = null;
    try { body = options && options.body ? JSON.parse(options.body) : null; } catch (e) {}
    await new Promise((r) => setTimeout(r, 120));
    return new Response(JSON.stringify(routes[key](body)), { status: 200, headers: { 'Content-Type': 'application/json' } });
  };
})();
</script>
<script src="../gaia-app-urls.js"></script>
<script src="../gaia-myevents.js"></script>
<script src="../gaia-card.js"></script>
<script>
  // A real QR image for the demo ticket, drawn client-side to avoid the network.
  (function(){ const c=document.createElement('canvas'); c.width=c.height=210; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,210,210); x.fillStyle='#000';
    let s=12345; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff;};
    for(let i=0;i<21;i++)for(let j=0;j<21;j++){ if(rnd()>0.55) x.fillRect(10+i*9,10+j*9,9,9); }
    const finder=(ox,oy)=>{x.fillStyle='#000';x.fillRect(ox,oy,63,63);x.fillStyle='#fff';x.fillRect(ox+9,oy+9,45,45);x.fillStyle='#000';x.fillRect(ox+18,oy+18,27,27);};
    finder(10,10);finder(137,10);finder(10,137); window.__demoQr=c.toDataURL('image/png'); })();
  document.addEventListener('DOMContentLoaded', () => {
    window.GaiaMyEvents.render().then(() => {
      if (new URLSearchParams(location.search).get('open') !== '0') setTimeout(() => window.GaiaMyEvents.openTicket(1), 300);
    });
  });
</script>
</body>
</html>
