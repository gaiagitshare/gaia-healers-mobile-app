<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gaia Healers, original artwork: a standing figure in a rainbow biofield. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffe066" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a52"/><stop offset="1" stop-color="#16346a"/></linearGradient>
  </defs>
  <g transform="translate(100 100)" fill="none" filter="url(#b2)">
    <circle r="92" stroke="#7a4dff" stroke-width="5" opacity=".75"/>
    <circle r="82" stroke="#3a7bff" stroke-width="5" opacity=".8"/>
    <circle r="72" stroke="#22c7ff" stroke-width="5" opacity=".8"/>
    <circle r="62" stroke="#38e08a" stroke-width="5" opacity=".85"/>
    <circle r="52" stroke="#c8f04a" stroke-width="5" opacity=".9"/>
    <circle r="42" stroke="#ffb534" stroke-width="5" opacity=".9"/>
    <circle r="33" stroke="#ff5a4f" stroke-width="5" opacity=".9"/>
  </g>
  <g transform="translate(100 100)">
    <circle r="96" fill="none" stroke="#b78bff" stroke-width="10" opacity=".25" filter="url(#b6)"/>
    <circle r="40" fill="url(#core)" filter="url(#b6)"/>
  </g>
  <!-- figure -->
  <g fill="url(#fig)" stroke="#9fd8ff" stroke-width="1.2" stroke-opacity=".7">
    <circle cx="100" cy="52" r="10"/>
    <path d="M90 64 C84 66 78 72 76 82 L70 112 C69 116 74 118 76 114 L84 88 L86 110 L82 150 C81 156 89 157 90 151 L96 118 L100 118 L104 151 C105 157 113 156 112 150 L108 110 L110 88 L118 114 C120 118 125 116 124 112 L118 82 C116 72 110 66 104 64 Z"/>
  </g>
  <g filter="url(#b2)">
    <circle cx="100" cy="52" r="2.6" fill="#c08bff"/><circle cx="100" cy="70" r="2.4" fill="#5aa9ff"/><circle cx="100" cy="82" r="2.6" fill="#38e08a"/>
    <circle cx="100" cy="94" r="2.6" fill="#ffe066"/><circle cx="100" cy="104" r="2.6" fill="#ffb534"/><circle cx="100" cy="114" r="2.6" fill="#ff5a4f"/>
  </g>
</svg>
